<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book a Capitec branch appointment in a few taps and get instant confirmation by email and SMS." />
    <meta name="theme-color" content="#00466f" />
    <title>Capitec | Branch Appointments</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Splash screen: plain HTML/CSS so it paints before the app bundle loads.
         Removed by dismissSplash() in src/lib/splash.ts once React has mounted. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #eef2f5;
        transition: opacity 0.4s ease, visibility 0.4s;
        /* Safety net: if the app never mounts, don't cover the page forever.
           (Inline scripts are blocked by the CSP, so this has to be CSS.) */
        animation: splash-timeout 0.4s ease 10s forwards;
      }
      #splash.splash--leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash__lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        animation: splash-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash__name {
        text-align: center;
        font-family: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.15;
      }
      .splash__name strong {
        display: block;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0d2233;
      }
      .splash__name span {
        display: block;
        margin-top: 6px;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #00466f;
      }
      .splash__bar {
        position: relative;
        width: 148px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: #d7dee4;
      }
      .splash__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00466f, #e73934);
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      .splash__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: translateY(10px) scale(0.96); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @keyframes splash-timeout {
        to { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__lockup,
        .splash__bar::after {
          animation: none;
        }
      }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="splash" role="status">
      <div class="splash__lockup">
        <div class="splash__name">
          <strong>Capitec</strong>
          <span>Branch Appointments</span>
        </div>
        <div class="splash__bar" aria-hidden="true"></div>
        <span class="splash__sr">Loading Capitec Branch Appointments</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
