# Quality gate: lint, typecheck, unit tests with coverage, build, E2E, and a
# Docker image smoke test plus vulnerability scan.
#
# Runs on every pull request, and is called by deploy.yml as the first stage
# of every dev/staging/prod deployment, so nothing ships without passing it.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    name: Unit tests (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        workspace: [server, client]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Vitest with coverage
        working-directory: ${{ matrix.workspace }}
        run: >
          npx vitest run --coverage
          --reporter=default --reporter=junit
          --outputFile.junit=reports/junit.xml
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Test results (${{ matrix.workspace }})
          path: ${{ matrix.workspace }}/reports/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Coverage report
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ${{ matrix.workspace }}
          working-directory: ${{ matrix.workspace }}
      - name: Upload coverage HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.workspace }}
          path: ${{ matrix.workspace }}/coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle size summary
        run: |
          {
            echo "### Client bundle"
            echo "| File | Size |"
            echo "|---|---|"
            find client/dist/assets -type f \( -name '*.js' -o -name '*.css' \) -printf '%s %p\n' \
              | sort -rn | awk '{ printf "| `%s` | %.1f kB |\n", $2, $1/1024 }'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.tmp/server.log
          retention-days: 14

  docker:
    name: Docker smoke test & scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: capitec-appointment:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 capitec-appointment:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health | grep -q '"commit":"${{ github.sha }}"'
          curl -sf http://localhost:3000/api/branches | grep -q "Sandton City"
          curl -sf http://localhost:3000/ | grep -qi "<html"
          docker logs app
          docker rm -f app
      - name: Scan image for vulnerabilities (Grype)
        id: scan
        uses: anchore/scan-action@v6
        with:
          image: capitec-appointment:ci
          fail-build: false
          severity-cutoff: critical
          only-fixed: true
      - name: Upload scan to the Security tab
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container-image

  # Single check to mark as "required" in branch rules, instead of one per job.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs: [lint, unit-tests, build, e2e, docker]
    steps:
      - name: All quality gates green?
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo '${{ toJSON(needs) }}' | jq -e 'to_entries | map(.value.result) | any(. != "success")' > /dev/null; then
            echo "::error::One or more CI stages failed or were cancelled."
            exit 1
          fi
